name: Semgrep Security Scan
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '12 15 * * *'

jobs:
  semgrep:
    uses: VerifyYou/infra-common/.github/workflows/reusable-semgrep.yml@v0.4.0
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      checks: write
    with:
      rule-packs: 'p/security-audit p/secrets p/typescript'
    secrets: inherit
